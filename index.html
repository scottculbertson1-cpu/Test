<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbit Keeper</title>
<style>
  :root { --bg:#0b0d17; --fg:#e8ecff; --accent:#7cf3d0; --warn:#ff6b8b; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow:hidden;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:12px; left:16px; right:16px; display:flex; justify-content:space-between;
    font-size:18px; pointer-events:none; text-shadow:0 0 8px #000; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:16px; background:rgba(11,13,23,.78); }
  #overlay h1 { font-size:clamp(32px,8vw,64px); margin:0 0 8px; color:var(--accent); letter-spacing:2px; }
  #overlay p { max-width:480px; line-height:1.5; opacity:.9; margin:6px 0; }
  #overlay button { margin-top:18px; font-size:20px; padding:12px 32px; border:0; border-radius:999px;
    background:var(--accent); color:#0b0d17; font-weight:700; cursor:pointer; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">Score 0</span><span id="lives">♥♥♥</span><span id="best">Best 0</span></div>
<div id="overlay">
  <h1>ORBIT KEEPER</h1>
  <p>Meteors are falling toward your core. Spin the shield to deflect them.</p>
  <p><b>Keyboard:</b> ← / → or A / D &nbsp; · &nbsp; <b>Mouse / touch:</b> point or drag where the shield should face.</p>
  <p>Gold stars widen your shield for a while. Deflections in a row build a combo.</p>
  <button id="start">Play</button>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $score = document.getElementById('score'), $lives = document.getElementById('lives'),
        $best = document.getElementById('best'), $ov = document.getElementById('overlay'),
        $btn = document.getElementById('start');
  let W, H, cx, cy, R, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W / 2; cy = H / 2; R = Math.min(W, H) * 0.16;
  }
  addEventListener('resize', resize); resize();

  let best = 0; try { best = +localStorage.getItem('orbitKeeperBest') || 0; } catch (e) {}
  $best.textContent = 'Best ' + best;

  const stars = Array.from({length: 120}, () => ({x: Math.random(), y: Math.random(), s: Math.random()*1.5+.3}));
  let state = 'menu', angle = -Math.PI/2, target = null, keys = {};
  let rocks, particles, score, lives, combo, t, spawnT, wideT, shake;

  function reset() {
    rocks = []; particles = []; score = 0; lives = 3; combo = 0; t = 0; spawnT = 1; wideT = 0; shake = 0;
    updateHud();
  }
  function updateHud() {
    $score.textContent = 'Score ' + score + (combo > 1 ? '  ×' + combo : '');
    $lives.textContent = '♥'.repeat(Math.max(lives,0)) || '—';
  }
  const arc = () => (wideT > 0 ? 1.5 : 0.9);               // shield half-width (radians)
  const angDiff = (a, b) => Math.atan2(Math.sin(a-b), Math.cos(a-b));

  function spawn() {
    const a = Math.random() * Math.PI * 2, dist = Math.hypot(W, H) / 2 + 40;
    const speed = 70 + Math.min(t * 2.2, 190) + Math.random() * 40;
    const gold = Math.random() < 0.07;
    rocks.push({ x: cx + Math.cos(a)*dist, y: cy + Math.sin(a)*dist, a, speed, gold,
      r: gold ? 9 : 7 + Math.random()*7, spin: Math.random()*6, dead: false, bounced: false,
      vx: 0, vy: 0 });
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random()*Math.PI*2, s = 40 + Math.random()*180;
      particles.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: .6 + Math.random()*.4, color});
    }
  }

  function step(dt) {
    t += dt;
    // input → shield angle
    const turn = 5.2 * dt;
    if (keys.ArrowLeft || keys.a || keys.A) { angle -= turn; target = null; }
    if (keys.ArrowRight || keys.d || keys.D) { angle += turn; target = null; }
    if (target !== null) angle += angDiff(target, angle) * Math.min(1, dt * 14);
    if (wideT > 0) wideT -= dt;
    shake = Math.max(0, shake - dt * 30);

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); if (t > 40 && Math.random() < .3) spawn(); spawnT = Math.max(0.35, 1.3 - t * 0.012); }

    const shieldR = R * 1.45;
    for (const r of rocks) {
      if (r.bounced) { r.x += r.vx*dt; r.y += r.vy*dt;
        if (r.x < -60 || r.x > W+60 || r.y < -60 || r.y > H+60) r.dead = true; continue; }
      const dx = cx - r.x, dy = cy - r.y, d = Math.hypot(dx, dy);
      r.x += dx/d * r.speed*dt; r.y += dy/d * r.speed*dt; r.spin += dt*3;
      const nd = d - r.speed*dt;
      if (nd <= shieldR + r.r && nd > shieldR - 14) {
        const ra = Math.atan2(r.y - cy, r.x - cx);
        if (Math.abs(angDiff(ra, angle)) < arc()) {
          r.bounced = true; r.vx = Math.cos(ra) * r.speed * 1.6; r.vy = Math.sin(ra) * r.speed * 1.6;
          if (r.gold) { wideT = 8; burst(r.x, r.y, '#ffd166', 26); }
          else burst(r.x, r.y, '#7cf3d0', 12);
          combo++; score += 10 * Math.min(combo, 10); updateHud();
          continue;
        }
      }
      if (nd <= R * 0.55 + r.r) {
        r.dead = true;
        if (!r.gold) { lives--; combo = 0; shake = 10; burst(r.x, r.y, '#ff6b8b', 30); updateHud();
          if (lives <= 0) return gameOver(); }
      }
    }
    rocks = rocks.filter(r => !r.dead);
    for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = '#0b0d17'; ctx.fillRect(0, 0, W, H);
    if (shake) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
    for (const s of stars) { ctx.globalAlpha = .4 + .3*Math.sin(performance.now()/900 + s.x*50);
      ctx.fillStyle = '#fff'; ctx.fillRect(s.x*W, s.y*H, s.s, s.s); }
    ctx.globalAlpha = 1;

    // core
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*0.75);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.35, '#8fb8ff'); g.addColorStop(1, 'rgba(60,90,200,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R*0.75, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,236,255,.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R*1.45, 0, Math.PI*2); ctx.stroke();

    // shield
    const wide = wideT > 0;
    ctx.strokeStyle = wide ? '#ffd166' : '#7cf3d0'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(cx, cy, R*1.45, angle - arc(), angle + arc()); ctx.stroke();
    ctx.shadowBlur = 0;

    // rocks
    for (const r of rocks) {
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.spin);
      if (r.gold) {
        ctx.fillStyle = '#ffd166'; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const rr = i%2 ? r.r*.45 : r.r*1.3, a = i*Math.PI/5;
          ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = r.bounced ? '#5c6a8a' : '#c58b6b'; ctx.beginPath();
        for (let i = 0; i < 7; i++) { const a = i/7*Math.PI*2, rr = r.r*(0.75 + ((i*37)%5)/12);
          ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    for (const p of particles) { ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color;
      ctx.fillRect(p.x-2, p.y-2, 4, 4); }
    ctx.restore();
  }

  function gameOver() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('orbitKeeperBest', best); } catch (e) {} }
    $best.textContent = 'Best ' + best;
    $ov.querySelector('h1').textContent = 'CORE BREACHED';
    $ov.querySelectorAll('p').forEach((p, i) => { p.style.display = i ? 'none' : ''; });
    $ov.querySelector('p').textContent = 'Score ' + score + ' · Best ' + best;
    $btn.textContent = 'Play again';
    $ov.classList.remove('hidden');
  }
  function start() { reset(); state = 'play'; $ov.classList.add('hidden'); }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (state === 'play') step(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  $btn.addEventListener('click', start);
  addEventListener('keydown', e => { keys[e.key] = true;
    if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') start(); });
  addEventListener('keyup', e => { keys[e.key] = false; });
  const aim = e => { if (state === 'play') target = Math.atan2(e.clientY - cy, e.clientX - cx); };
  cv.addEventListener('pointermove', aim);
  cv.addEventListener('pointerdown', aim);
  reset();
})();
</script>
</body>
</html>
